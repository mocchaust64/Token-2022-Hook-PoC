name: Solana Token-2022 Hook CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        cache: 'npm'
        
    - name: Install Solana CLI
      uses: ./.github/actions/install-solana
      
    - name: Install dependencies
      run: npm install
      
    - name: Build
      run: anchor build
      
    - name: Run linting
      run: |
        cargo fmt -- --check
        cargo clippy -- -D warnings 